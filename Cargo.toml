wasm-bindgen-futures = "0.4"

# Sandboxed deterministic runtime for shared-audio instrument modules
# (packages/audio/instrument). Minimal feature set: Cranelift JIT, the
# runtime itself, WAT text support for built-in/demo instruments, and the
# std/signals/parallel-compilation platform features.
wasmtime = { version = "46", default-features = false, features = [
  "anyhow",
  "cranelift",
  "runtime",
  "wat",
  "std",
  "parallel-compilation",
] }
# `transparent` is a non-default feature: without it `with_transparent(true)`
# is a silent no-op and the webview paints an opaque canvas, hiding the
# ix-windows blur behind a flat card.
wry = { version = "0.55", features = ["transparent"] }
x509-parser = "0.18"
xxhash-rust = { version = "0.8", default-features = false }
# Container format only (ReplayMod .mcpr archives); the compression backends
# are opted into per consumer, so the default heavyweight codecs (zstd, lzma,
# bzip2) stay out of the build graph.
zip = { version = "7", default-features = false }

# Workspace-wide crate substitutions. `tree-sitter-nix` is the in-repo fork
# carrying underscore digit separators in numeric literals (the dialect the
# patched nix-ix lexer accepts; see packages/tree-sitter-nix/README.md),
# so astlog, clone-detect, and every other ast-merge-langs consumer parse the
# same numbers nix does.
[patch.crates-io]
tree-sitter-nix = { path = "packages/tree-sitter-nix" }
