name: Fuzz minecraft-nbt

on:
  pull_request:
    paths:
      - "packages/minecraft/nbt/**"
      - ".github/workflows/fuzz-nbt.yml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: fuzz-nbt-${{ github.ref }}
  cancel-in-progress: true

env:
  # Client-side eval knobs only; the self-hosted runner's Nix daemon owns
  # substituters and trusted keys. Same posture as check.yml / fork-sync.yml.
  # This lane evaluates no repo Nix, but the ensure-tools step below shells out
  # to a bare `nix build nixpkgs#...`, which needs the features enabled.
  # `max-jobs` and `cores` are deliberately absent: unlike every other knob
  # they are not daemon-owned, and a client value silently overrides the
  # fleet tuning. check.yml owns the explanation.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes ca-derivations wasm-builtin blake3-hashes
    accept-flake-config = false
    timeout = 600

jobs:
  fuzz:
    # Dispatched to the org-wide ix-ci-dispatcher, the same self-hosted runner
    # scheme as check.yml: the `ix-ci-run-*` label is claimed by the
    # dispatcher, which mints an ephemeral runner per job on a host with a
    # warm, persistent /nix/store.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-fuzz-nbt', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `rustup`: it reads rust-toolchain.toml and downloads the nightly pinned
      # there, and cargo-fuzz needs exactly that -- `-Zsanitizer=address` and
      # the `-Zbuild-std` sysroot rebuild are nightly-only. nixpkgs' rustup
      # patchelfs every binary it downloads onto the Nix dynamic linker, so
      # upstream's FHS tarballs run on this host.
      # `cc`: rustc drives linking through `cc`, and libfuzzer-sys 0.4 compiles
      # the vendored libFuzzer C++ sources with the `cc` crate. nixpkgs' rustup
      # deliberately ships no compiler, and the runner's PATH has none; one
      # `gcc` supplies both `cc` and `c++`, which is also what those names
      # resolved to on the hosted Ubuntu image.
      - name: Provision missing CLI tools
        uses: ./.github/actions/ensure-tools
        with:
          tools: rustup cc=gcc

      # Pin the cargo-fuzz version so a crates.io release cannot change the gate
      # silently. `--locked` is incompatible with the toolchain because
      # cargo-fuzz 0.13.1's lockfile pins an old `rustix` that no longer
      # compiles, so resolve the install's own deps unlocked.
      #
      # The binary lands in $CARGO_HOME/bin, which the hosted image used to put
      # on PATH and this runner does not. Nothing needs to: cargo prepends that
      # directory to its own `cargo-*` subcommand search, so `cargo fuzz` below
      # resolves regardless.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1

      - name: Fuzz decode_document for 60 seconds
        working-directory: packages/minecraft/nbt/fuzz
        run: |
          cargo fetch --locked
          mkdir -p corpus/decode_document
          cp seeds/decode_document/* corpus/decode_document/
          cargo fuzz run decode_document -- -max_total_time=60 -timeout=10
