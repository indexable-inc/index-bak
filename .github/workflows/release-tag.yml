name: Release tag

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    # Dispatched to the org-wide ix-ci-dispatcher, the same self-hosted
    # runner scheme as check.yml: the `ix-ci-run-*` label is claimed by the
    # dispatcher, which mints an ephemeral runner per job. The ancestry
    # check is pure git, which the runner's minimal PATH already carries,
    # so this lane provisions nothing.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-release-tag', github.run_id, github.run_attempt) }}"]
    # No green samples yet; checkout + ancestry check, sized like the other
    # sub-minute gates (2026-07-17). 10m floor.
    timeout-minutes: 10
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require tag on main
        run: |
          set -euo pipefail

          git fetch origin +refs/heads/main:refs/remotes/origin/main

          tag_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tags must point at commits reachable from origin/main."
            exit 1
          fi
