name: Shared read-only CI budget

on:
  workflow_call:
    inputs:
      pull-request-number:
        description: Pull request number, or 0 outside a pull request
        type: number
        default: 0
      force-big-change:
        description: Grant the extended budget without a path or label match
        type: boolean
        default: false
      head-sha:
        description: Head commit for a non-pull-request change association
        type: string
        default: ""
      base-sha:
        description: Push base commit that bounds a main-branch change
        type: string
        default: ""
      runner-label:
        description: Runner label for the policy job
        type: string
        default: ubuntu-latest
    outputs:
      big_change:
        description: Whether the extended CI budget applies
        value: ${{ jobs.classify.outputs.big_change }}
      reason:
        description: JSON object describing every source of the decision
        value: ${{ jobs.classify.outputs.reason }}
      queue_start_seconds:
        description: Maximum wait from worker creation to runner assignment
        value: ${{ jobs.classify.outputs.queue_start_seconds }}
      setup_allowance_seconds:
        description: Maximum setup time after runner assignment
        value: ${{ jobs.classify.outputs.setup_allowance_seconds }}
      validation_seconds:
        description: Validation allowance for the classified tier
        value: ${{ jobs.classify.outputs.validation_seconds }}
      termination_grace_seconds:
        description: Cleanup allowance after validation
        value: ${{ jobs.classify.outputs.termination_grace_seconds }}
      worker_timeout_minutes:
        description: Assignment-relative worker backstop for the classified tier
        value: ${{ jobs.classify.outputs.worker_timeout_minutes }}

jobs:
  classify:
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      big_change: ${{ steps.budget.outputs.big_change }}
      reason: ${{ steps.budget.outputs.reason }}
      queue_start_seconds: ${{ steps.budget.outputs.queue_start_seconds }}
      setup_allowance_seconds: ${{ steps.budget.outputs.setup_allowance_seconds }}
      validation_seconds: ${{ steps.budget.outputs.validation_seconds }}
      termination_grace_seconds: ${{ steps.budget.outputs.termination_grace_seconds }}
      worker_timeout_minutes: ${{ steps.budget.outputs.worker_timeout_minutes }}
    steps:
      # job.workflow_sha identifies this called workflow, not untrusted caller
      # code. The local action therefore stays on the exact reviewed policy.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context
      - name: Checkout this policy version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-budget-owner
          persist-credentials: false
      - name: Classify CI budget
        id: budget
        uses: ./.ci-budget-owner/.github/actions/ci-budget
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ inputs.pull-request-number }}
          token: ${{ github.token }}
          force-big-change: ${{ inputs.force-big-change }}
          base-sha: ${{ inputs.base-sha }}
          head-sha: ${{ inputs.head-sha }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          publish: false
