name: Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    # The one lane that stays GitHub-hosted. ossf/scorecard-action is a
    # container action (`runs.using: docker`, image
    # ghcr.io/ossf/scorecard-action:v2.4.3), so the runner has to hand the
    # job a working Docker daemon. The ix ephemeral runners are Nix-based
    # and ship none, so dispatching this to `ix-ci-run-*` would not degrade
    # the scan, it would fail the step outright. Do not migrate it until
    # scorecard ships a non-container entrypoint.
    runs-on: ubuntu-latest
    # p95 1m over last 30 green runs (2026-07-17); 10m floor.
    timeout-minutes: 10
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Reads classic branch protection rules. Default GITHUB_TOKEN
          # cannot, so Branch-Protection falls back to -1 ("internal
          # error") without a PAT. See #89 for the secret setup.
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
