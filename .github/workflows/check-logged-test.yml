name: Check logged action

on:
  pull_request:
    paths:
      - .github/actions/check-logged/**
      - .github/scripts/run-required-gate*.sh
      - .github/workflows/check-logged-test.yml

permissions:
  contents: read

env:
  # ensure-tools resolves `nixpkgs#` attrs through the runner's nix client,
  # which needs the flake CLI enabled. Only those two features: this lane
  # never evaluates this repo's flake, so the `ca-derivations` /
  # `wasm-builtin` knobs the build lanes carry would buy nothing here.
  NIX_CONFIG: |-
    experimental-features = nix-command flakes

jobs:
  test:
    # Dispatched to the org-wide ix-ci-dispatcher, the same self-hosted
    # runner scheme as check.yml: the `ix-ci-run-*` label is claimed by the
    # dispatcher, which mints an ephemeral runner per job.
    runs-on: ["${{ format('ix-ci-run-{0}-{1}-check-logged-test', github.run_id, github.run_attempt) }}"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both suites build their own stub PATH and run the scripts under
      # `env -i`, so they need almost nothing from the runner. The one
      # exception is run-required-gate-test.sh's final assertion, which
      # greps the captured stderr for `EVENT_BASE_SHA is required`, and grep
      # is not part of coreutils.
      - name: Provision missing CLI tools
        uses: ./.github/actions/ensure-tools
        with:
          tools: grep=gnugrep

      - name: Test minimal PATH logging
        run: |
          bash .github/actions/check-logged/test.sh
          bash .github/scripts/run-required-gate-test.sh
